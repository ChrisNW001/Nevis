[project]
name = "nevis"
version = "0.2.0"
description = "Nevis - Master AI Assistant that connects everything"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Chris"}
]
dependencies = [
    "httpx>=0.25.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "notion-client>=2.0.0",
]

[project.optional-dependencies]
llm = [
    "anthropic>=0.40.0",
    "openai>=1.50.0",
    "tiktoken>=0.7.0",
]
api = [
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
]
all = [
    "nevis[llm,api]",
]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.1.0",
    "nevis[all]",
]

[project.scripts]
nevis = "nevis.main:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
